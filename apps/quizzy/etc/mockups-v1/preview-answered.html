<!DOCTYPE html>
<!-- Quizzy mockup: Preview: after a wrong pick. A static copy of the page; forms and links do not work. -->
<html lang="en"><head>

    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Quizzy">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#e9e6ff">

    <link rel="stylesheet" href="quizzy.css">

  <title>Preview · Frontend Fest 2026</title></head>

  <body class="">

<div class="preview-banner">
  <span>Preview · answers are not saved</span>
  <span class="buttons">
    <form class="button_to" method="post" action="/moderate/quizzes/1/preview"><input type="hidden" name="_method" value="delete"><button class="btn btn--light btn--sm" type="submit">Start over</button></form>
    <a href="/moderate/quizzes/1">Back to quiz</a>
  </span>
</div>

<div class="play">
  <div class="play__top">
    <span class="logo play__logo"><span class="logo__mark" aria-hidden="true">?</span>Quizzy</span>
  </div>

    <div class="play__body play__body--top">
      <div class="play-question__num">Question 1 of 2</div>
<div class="play-question__body">Which HTTP status code means "Too Many Requests"?</div>

<div class="play-options is-locked is-revealed">
      <div class="play-option is-picked">      <span class="play-option__letter">A</span>
      <span class="play-option__title">418</span>
      <span class="play-option__mark">Your answer</span>

</div>
      <div class="play-option is-correct">      <span class="play-option__letter">B</span>
      <span class="play-option__title">429</span>

      <span class="play-option__mark">Correct answer</span>
</div>
      <div class="play-option">      <span class="play-option__letter">C</span>
      <span class="play-option__title">503</span>

</div>
      <div class="play-option">      <span class="play-option__letter">D</span>
      <span class="play-option__title">409</span>

</div>
</div>

        <div class="play-status play-status--wrong">
          Wrong!
        </div>
        <div class="buttons mt-2">
          <a class="btn btn--pink" href="/moderate/quizzes/1/preview?step=1">Next question</a>
        </div>
    </div>
</div>

</body></html>
