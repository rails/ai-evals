<!DOCTYPE html>
<!-- Quizzy mockup: Moderator: new question form. A static copy of the page; forms and links do not work. -->
<html lang="en"><head>

    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Quizzy">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#e9e6ff">

    <link rel="stylesheet" href="quizzy.css">

  <title>New question</title></head>

  <body class="">
      <header class="admin-header">
    <a class="admin-header__logo" title="All quizzes" href="/moderate">
      <span class="logo"><span class="logo__mark" aria-hidden="true">?</span>Quizzy</span>
</a>    <span class="admin-header__tag">Moderator</span>
  </header>

  <main class="admin-main">

<div class="breadcrumbs"><a href="/moderate/quizzes/1">← Frontend Fest 2026</a></div>
<div class="page-head"><h1>New question</h1></div>

<form class="card" action="/moderate/quizzes/1/questions" accept-charset="UTF-8" method="post">

  <div class="field">
    <label for="question_body">Question</label>
    <textarea class="input" required="required" autofocus="autofocus" rows="3" name="question[body]" id="question_body"></textarea>
  </div>

  <div class="field">
    <span class="field-label">Options</span>
    <span class="field-hint">Mark the correct options, at least one. Empty rows are skipped.</span>
  </div>

  <div class="option-rows">
      <div class="option-row">
  <input type="text" name="question[options][0][title]" id="question_options_0_title" value="" class="input" placeholder="Option 1" aria-label="Option 1">
  <label class="checkbox">
    <input type="hidden" name="question[options][0][correct]" value="0">
    <input type="checkbox" name="question[options][0][correct]" value="1" aria-label="Option 1 is correct">
    Correct
  </label>
  <button type="button" class="btn btn--danger btn--icon" title="Remove option" aria-label="Remove option 1">✕</button>
</div>

      <div class="option-row">
  <input type="text" name="question[options][1][title]" id="question_options_1_title" value="" class="input" placeholder="Option 2" aria-label="Option 2">
  <label class="checkbox">
    <input type="hidden" name="question[options][1][correct]" value="0">
    <input type="checkbox" name="question[options][1][correct]" value="1" aria-label="Option 2 is correct">
    Correct
  </label>
  <button type="button" class="btn btn--danger btn--icon" title="Remove option" aria-label="Remove option 2">✕</button>
</div>

      <div class="option-row">
  <input type="text" name="question[options][2][title]" id="question_options_2_title" value="" class="input" placeholder="Option 3" aria-label="Option 3">
  <label class="checkbox">
    <input type="hidden" name="question[options][2][correct]" value="0">
    <input type="checkbox" name="question[options][2][correct]" value="1" aria-label="Option 3 is correct">
    Correct
  </label>
  <button type="button" class="btn btn--danger btn--icon" title="Remove option" aria-label="Remove option 3">✕</button>
</div>

      <div class="option-row">
  <input type="text" name="question[options][3][title]" id="question_options_3_title" value="" class="input" placeholder="Option 4" aria-label="Option 4">
  <label class="checkbox">
    <input type="hidden" name="question[options][3][correct]" value="0">
    <input type="checkbox" name="question[options][3][correct]" value="1" aria-label="Option 4 is correct">
    Correct
  </label>
  <button type="button" class="btn btn--danger btn--icon" title="Remove option" aria-label="Remove option 4">✕</button>
</div>

  </div>

  <template>
    <div class="option-row">
  <input type="text" name="question[options][NEW_INDEX][title]" id="question_options_NEW_INDEX_title" class="input" placeholder="Option NEW_NUMBER" aria-label="Option NEW_NUMBER">
  <label class="checkbox">
    <input type="hidden" name="question[options][NEW_INDEX][correct]" value="0">
    <input type="checkbox" name="question[options][NEW_INDEX][correct]" value="1" aria-label="Option NEW_NUMBER is correct">
    Correct
  </label>
  <button type="button" class="btn btn--danger btn--icon" title="Remove option" aria-label="Remove option NEW_NUMBER">✕</button>
</div>

  </template>

  <div class="buttons" style="margin-bottom: 28px">
    <button type="button" class="btn btn--ghost btn--sm">+ Add option</button>
  </div>

  <div class="field">
    <label class="checkbox">
      <input name="question[active]" type="hidden" value="0"><input type="checkbox" value="1" checked="checked" name="question[active]" id="question_active">
      Active
    </label>
    <span class="field-hint">Only active questions are played.</span>
  </div>

  <div class="buttons">
    <input type="submit" name="commit" value="Save question" class="btn btn--pink">
    <a class="btn btn--ghost" href="/moderate/quizzes/1">Cancel</a>
  </div>
</form>

  </main>

</body></html>
