<!DOCTYPE html>
<!-- Quizzy mockup: Big screen: results with answer counts and the correct option. A static copy of the page; forms and links do not work. -->
<html lang="en"><head>

    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Quizzy">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#e9e6ff">

    <link rel="stylesheet" href="quizzy.css">

  <title>Frontend Fest 2026 · K7RZX</title></head>

  <body class="">

<div class="game">
    <section class="cover cover--blue cover--calm">
  <div class="screen">
    <div class="screen__top">
      <span class="logo screen__logo"><span class="logo__mark" aria-hidden="true">?</span>Quizzy</span>
      <span>Frontend Fest 2026</span>
    </div>
    <div class="screen__body">
      <div class="stage-question__head">
        <div class="stage-question__num">Question 1 of 2</div>
      </div>
      <div class="stage-question__body">Which HTTP status code means "Too Many Requests"?</div>
      <ol class="stage-options stage-options--results">
          <li class="stage-option " style="--share: 50.0%">
            <span class="stage-option__bar"></span>
            <span class="stage-option__letter">A</span>
            <span class="stage-option__title">418</span>

            <span class="stage-option__count" title="Answers">1</span>
          </li>
          <li class="stage-option is-correct" style="--share: 50.0%">
            <span class="stage-option__bar"></span>
            <span class="stage-option__letter">B</span>
            <span class="stage-option__title">429</span>
            <span class="stage-option__mark">Correct</span>
            <span class="stage-option__count" title="Answers">1</span>
          </li>
          <li class="stage-option " style="--share: 0.0%">
            <span class="stage-option__bar"></span>
            <span class="stage-option__letter">C</span>
            <span class="stage-option__title">503</span>

            <span class="stage-option__count" title="Answers">0</span>
          </li>
          <li class="stage-option " style="--share: 0.0%">
            <span class="stage-option__bar"></span>
            <span class="stage-option__letter">D</span>
            <span class="stage-option__title">409</span>

            <span class="stage-option__count" title="Answers">0</span>
          </li>
      </ol>
    </div>
  </div>
</section>

  <nav class="screen-controls" aria-label="Game controls">
    <div class="screen-controls__info">
      <a href="/moderate/quizzes/1">← Back to quiz</a>
      <span>Code: <strong>K7RZX</strong></span>
      <span id="participants_counter">3 players</span>

        <span id="answers_counter" class="answers-counter">
  Answers: 2 / 3
</span>

    </div>

    <div class="buttons">
        <form class="button_to" method="post" action="/moderate/runs/K7RZX/advance"><button class="btn btn--pink btn--lg" type="submit">Next</button></form>
    </div>
  </nav>
</div>

</body></html>
