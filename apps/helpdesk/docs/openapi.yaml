  "/api/v1/tickets/{id}/merge":
    post:
      operationId: mergeTicket
      summary: Merge a duplicate into another ticket
      description: >-
        Admins and agents. The source must be open or pending; the target must be open, pending or solved,
        in this business and have the same requester. Missing or foreign tickets return 404; self-merges,
        ineligible statuses and different requesters return 422. Atomically closes the source, records
        the direct target ID, and appends exactly one staff-authored note to each ticket. Optional note
        bodies replace default private notes that identify the opposite ticket. Note visibility defaults
        to private; no merge note sends email. Original histories, assignments and priorities stay on
        their original tickets. The target's status and email identity are preserved. Both source timestamps
        advance; the target's customer timestamp advances only for a public target note. Closed sources
        remain readable and listed; all direct PATCHes and repeat merges return 422. A survivor may later
        be merged, retaining previous direct pointers; no unmerge exists.
      tags:
      - Tickets
      parameters:
      - "$ref": "#/components/parameters/AccountHeader"
      - "$ref": "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                merge:
                  "$ref": "#/components/schemas/MergeInput"
              required:
              - merge
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  source:
                    "$ref": "#/components/schemas/Ticket"
                  target:
                    "$ref": "#/components/schemas/Ticket"
                required:
                - source
                - target
