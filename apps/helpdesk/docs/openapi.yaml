      scheme: bearer
      bearerFormat: Opaque session token
    RelayBasic:
      type: http
      scheme: basic
      description: >-
        Trusted mail relay credentials: username actionmailbox and password configured by RAILS_INBOUND_EMAIL_PASSWORD.
  parameters:
    AccountHeader:
      name: X-Helpdesk-Account
      in: header
      required: true
      description: >-
        Business subdomain, trimmed and compared case-insensitively. Missing or malformed: 400; unknown
        business: 404.
      schema:
        "$ref": "#/components/schemas/Subdomain"
    ResourceId:
      name: id
      in: path
      required: true
      description: Hyphenated UUID; either letter case is accepted. Invalid or inaccessible IDs return 404.
      schema:
        "$ref": "#/components/schemas/Id"
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: >-
        Offset page number, encoded once as a positive decimal integer without a leading zero. Defaults
        to 1.
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Offset page size, encoded once as a positive decimal integer without a leading zero.
        Defaults to 25.
    PageSize:
      name: page[size]
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: >-
        Select cursor pagination. Required when either cursor is supplied; no default. Cannot be combined
        with page or per_page. Decimal integer from 1 through 100.
    PageAfter:
      name: page[after]
      in: query
      required: false
      schema:
        "$ref": "#/components/schemas/Cursor"
      description: Read strictly after this saved position. Requires page[size]; cannot be combined with
        page[before].
    PageBefore:
      name: page[before]
      in: query
      required: false
      schema:
        "$ref": "#/components/schemas/Cursor"
      description: >-
        Read the nearest preceding page, in normal order. Requires page[size]; cannot be combined with
        page[after].
  responses:
    Error400:
      description: 'BadRequest: malformed body, header or query, or missing required parameters. InvalidToken: unusable email-link token.'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error401:
      description: >-
        Unauthorized: missing, malformed, expired, revoked, wrong-business or otherwise unusable credentials.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error403:
      description: >-
        Forbidden: authenticated caller cannot perform this operation. EmailNotVerified: correct login
        password for an unverified user.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error404:
      description: 'NotFound: unknown business, route, invalid path ID or inaccessible resource.'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error409:
      description: 'Conflict: the operation conflicts with the resource''s current state.'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error415:
      description: 'UnsupportedMediaType: request body must use application/json.'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error422:
      description: >-
        ValidationError: invalid, unknown, forbidden or incorrectly typed attributes, including missing
        nested attributes. No changes are committed.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Id:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      description: >-
        Server-generated UUIDv7, returned in canonical lowercase, hyphenated form.
        Input IDs must be hyphenated; either letter case is accepted.
      examples:
      - '0199745e-6e00-7000-8000-000000000001'
    Timestamp:
      type: string
      format: date-time
      pattern: "\\.[0-9]+Z$"
      examples:
      - '2026-09-23T12:00:00.000000Z'
    Name:
      type: string
      minLength: 1
      description: Trimmed before validation and storage; must contain 1–100 Unicode characters after
        trimming.
    Email:
      type: string
      minLength: 1
      description: >-
        Trimmed and lowercased. At most 254 characters after normalization, exactly one @, a nonempty
        local part, a domain containing a dot, and no internal whitespace. Unique within a business; no
        DNS lookup.
      examples:
      - owner@acme.test
    Subdomain:
      type: string
      minLength: 1
      description: >-
        Trimmed and lowercased; normalized identifier is 3–40 characters matching [a-z0-9][a-z0-9-]* across
        the entire string. Globally unique.
      examples:
      - acme
    Password:
      type: string
      format: password
      writeOnly: true
      minLength: 12
      maxLength: 72
      description: >-
        At least 12 characters and at most 72 UTF-8 bytes. Passwords are not trimmed.
    PasswordAttempt:
      type: string
      format: password
      writeOnly: true
      description: >-
        Password used to authenticate an existing user. Whitespace is significant; the new-password
        minimum length does not apply to login attempts.
    Token:
      type: string
      minLength: 1
      description: Opaque, unguessable bearer secret. Never log or persist in recoverable form.
    Account:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        name:
          "$ref": "#/components/schemas/Name"
        subdomain:
          "$ref": "#/components/schemas/Subdomain"
        owner_id:
          "$ref": "#/components/schemas/Id"
        cancelled_at:
          anyOf:
          - "$ref": "#/components/schemas/Timestamp"
          - type: 'null'
        created_at:
          "$ref": "#/components/schemas/Timestamp"
        updated_at:
          "$ref": "#/components/schemas/Timestamp"
      required:
      - id
      - name
      - subdomain
      - owner_id
      - cancelled_at
      - created_at
      - updated_at
    Portal:
      type: object
      additionalProperties: false
      properties:
        name:
          "$ref": "#/components/schemas/Name"
        subdomain:
          "$ref": "#/components/schemas/Subdomain"
      required:
      - name
      - subdomain
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        name:
          "$ref": "#/components/schemas/Name"
        email:
          "$ref": "#/components/schemas/Email"
        role:
          type: string
          enum:
          - admin
          - agent
          - customer
        verified:
          type: boolean
        suspended:
          type: boolean
        created_at:
          "$ref": "#/components/schemas/Timestamp"
        updated_at:
          "$ref": "#/components/schemas/Timestamp"
      required:
      - id
      - name
      - email
      - role
      - verified
      - created_at
      - updated_at
      - suspended
    Session:
      type: object
      additionalProperties: false
      properties:
        token:
          "$ref": "#/components/schemas/Token"
        token_type:
          type: string
          enum:
          - Bearer
        expires_at:
          "$ref": "#/components/schemas/Timestamp"
      required:
      - token
      - token_type
      - expires_at
    GenericEmailMessage:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          enum:
          - If the account is eligible, an email will be sent.
      required:
      - message
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          enum:
          - BadRequest
          - InvalidToken
          - Unauthorized
          - EmailNotVerified
          - Forbidden
          - NotFound
          - Conflict
          - UnsupportedMediaType
          - ValidationError
        description:
          type: string
          minLength: 1
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - error
      - description
    Subject:
      type: string
      minLength: 1
      description: >-
        Trimmed on input; the normalized subject must be nonblank and at most 200 Unicode characters.
        Immutable after creation.
    CommentBody:
      type: string
      minLength: 1
      maxLength: 10000
      pattern: "\\S"
      description: Nonblank plain text. Original whitespace and line breaks are preserved.
    Person:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        name:
          "$ref": "#/components/schemas/Name"
      required:
      - id
      - name
    Requester:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        name:
          "$ref": "#/components/schemas/Name"
        email:
          "$ref": "#/components/schemas/Email"
      required:
      - id
      - name
      - email
    TicketStatus:
      type: string
      enum:
      - open
      - pending
      - solved
      - closed
    Request:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        subject:
          "$ref": "#/components/schemas/Subject"
        requester_id:
          "$ref": "#/components/schemas/Id"
        status:
          "$ref": "#/components/schemas/TicketStatus"
        created_at:
          "$ref": "#/components/schemas/Timestamp"
        updated_at:
          "$ref": "#/components/schemas/Timestamp"
        merged_into_id:
          anyOf:
          - "$ref": "#/components/schemas/Id"
          - type: 'null'
      required:
      - id
      - subject
      - requester_id
      - status
      - created_at
      - updated_at
      - merged_into_id
      description: >-
        Customer-visible ticket representation. updated_at tracks public conversation and status changes.
        Only the requester can access it.
    Ticket:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        subject:
          "$ref": "#/components/schemas/Subject"
        requester:
          "$ref": "#/components/schemas/Requester"
        status:
          "$ref": "#/components/schemas/TicketStatus"
        created_at:
          "$ref": "#/components/schemas/Timestamp"
        updated_at:
          "$ref": "#/components/schemas/Timestamp"
        assignee_id:
          anyOf:
          - "$ref": "#/components/schemas/Id"
          - type: 'null'
        assignee:
          anyOf:
          - "$ref": "#/components/schemas/Person"
          - type: 'null'
        priority:
          "$ref": "#/components/schemas/TicketPriority"
        group_id:
          anyOf:
          - "$ref": "#/components/schemas/Id"
          - type: 'null'
        group:
          anyOf:
          - "$ref": "#/components/schemas/GroupSummary"
          - type: 'null'
        merged_into_id:
          anyOf:
          - "$ref": "#/components/schemas/Id"
          - type: 'null'
      required:
      - id
      - subject
      - requester
      - status
      - created_at
      - updated_at
      - assignee_id
      - assignee
      - priority
      - group_id
      - group
      - merged_into_id
      description: >-
        Staff representation of a ticket in the selected business. Embedded user details reflect current
        profiles.
    Comment:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        body:
          "$ref": "#/components/schemas/CommentBody"
        public:
          type: boolean
        author:
          "$ref": "#/components/schemas/Person"
        created_at:
          "$ref": "#/components/schemas/Timestamp"
      required:
      - id
      - body
      - public
      - author
      - created_at
      description: Immutable comment; the embedded author contains only the user's current ID and name.
    CustomerCommentInput:
      type: object
      additionalProperties: false
      properties:
        body:
          "$ref": "#/components/schemas/CommentBody"
      required:
      - body
    StaffCommentInput:
      type: object
      additionalProperties: false
      properties:
        body:
          "$ref": "#/components/schemas/CommentBody"
        public:
          type: boolean
          default: true
      required:
      - body
    RequestUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - solved
        comment:
          "$ref": "#/components/schemas/CustomerCommentInput"
    TicketUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - open
          - pending
          - solved
        comment:
          "$ref": "#/components/schemas/StaffCommentInput"
        assignee_id:
          anyOf:
          - "$ref": "#/components/schemas/Id"
          - type: 'null'
          description: >-
            Null clears assignment. Otherwise use the UUID of verified, unsuspended staff in this business.
            Ineligible users return 422; missing users or users in another business return 404.
            Assignment does not limit ticket visibility.
        priority:
          "$ref": "#/components/schemas/TicketPriority"
        group_id:
          anyOf:
          - "$ref": "#/components/schemas/Id"
          - type: 'null'
          description: UUID of a group in this business; null clears the group.
    StaffRole:
      type: string
      enum:
      - admin
      - agent
    StaffMember:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        name:
          "$ref": "#/components/schemas/Name"
        role:
          "$ref": "#/components/schemas/StaffRole"
      required:
      - id
      - name
      - role
    InvitationStatus:
      type: string
      enum:
      - pending
      - accepted
      - revoked
      - expired
    Invitation:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        email:
          "$ref": "#/components/schemas/Email"
        role:
          "$ref": "#/components/schemas/StaffRole"
        status:
          "$ref": "#/components/schemas/InvitationStatus"
        expires_at:
          "$ref": "#/components/schemas/Timestamp"
        accepted_at:
          anyOf:
          - "$ref": "#/components/schemas/Timestamp"
          - type: 'null'
        created_at:
          "$ref": "#/components/schemas/Timestamp"
        updated_at:
          "$ref": "#/components/schemas/Timestamp"
      required:
      - id
      - email
      - role
      - status
      - expires_at
      - accepted_at
      - created_at
      - updated_at
      description: >-
        Contains no token or secret URL. Pending invitations appear expired once expires_at is reached,
        without changing stored timestamps; accepted and revoked invitations retain their state.
    InvitationPreview:
      type: object
      additionalProperties: false
      properties:
        email:
          "$ref": "#/components/schemas/Email"
        role:
          "$ref": "#/components/schemas/StaffRole"
        business_name:
          "$ref": "#/components/schemas/Name"
        subdomain:
          "$ref": "#/components/schemas/Subdomain"
        expires_at:
          "$ref": "#/components/schemas/Timestamp"
      required:
      - email
      - role
      - business_name
      - subdomain
      - expires_at
    TicketPriority:
      type: string
      enum:
      - normal
      - high
    Group:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        name:
          "$ref": "#/components/schemas/Name"
        created_at:
          "$ref": "#/components/schemas/Timestamp"
        updated_at:
          "$ref": "#/components/schemas/Timestamp"
      required:
      - id
      - name
      - created_at
      - updated_at
    GroupSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        name:
          "$ref": "#/components/schemas/Name"
      required:
      - id
      - name
    GroupMembership:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        group_id:
          "$ref": "#/components/schemas/Id"
        user_id:
          "$ref": "#/components/schemas/Id"
        default:
          type: boolean
        created_at:
          "$ref": "#/components/schemas/Timestamp"
        updated_at:
          "$ref": "#/components/schemas/Timestamp"
      required:
      - id
      - group_id
      - user_id
      - default
      - created_at
      - updated_at
    MergeCommentInput:
      type: object
      additionalProperties: false
      properties:
        body:
          "$ref": "#/components/schemas/CommentBody"
        public:
          type: boolean
          default: false
      required:
      - body
    MergeInput:
      type: object
      additionalProperties: false
      properties:
        target_id:
          "$ref": "#/components/schemas/Id"
          description: UUID of the target ticket in this business.
        source_comment:
          "$ref": "#/components/schemas/MergeCommentInput"
        target_comment:
          "$ref": "#/components/schemas/MergeCommentInput"
      required:
      - target_id
    Cursor:
      type: string
      minLength: 1
      description: >-
        Opaque, tamper-resistant saved position. Treat as uninterpreted and URL-encode when constructing
        requests.
    CursorMeta:
      type: object
      additionalProperties: false
      properties:
        has_more:
          type: boolean
        after_cursor:
          anyOf:
          - "$ref": "#/components/schemas/Cursor"
          - type: 'null'
        before_cursor:
          anyOf:
          - "$ref": "#/components/schemas/Cursor"
          - type: 'null'
      required:
      - has_more
      - after_cursor
      - before_cursor
      description: >-
        has_more describes the requested direction (earlier for page[before], later otherwise). Nonempty
        pages include both boundary cursors even at an edge. Empty pages have false has_more and null
        cursors.
    CursorLinks:
      type: object
      additionalProperties: false
      properties:
        next:
          anyOf:
          - type: string
            format: uri-reference
          - type: 'null'
        prev:
          anyOf:
          - type: string
            format: uri-reference
          - type: 'null'
      required:
      - next
      - prev
      description: >-
        Navigation links preserve the endpoint, active filters and page size; they contain only the appropriate
        cursor direction. Links are API-relative or same-origin absolute URLs. Missing neighbors have
        null links; both links are null for an empty page. Continue sending account and bearer headers.
