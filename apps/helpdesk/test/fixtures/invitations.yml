pending:
  account: acme
  email: invitee@example.test
  role: agent
  status: pending
  token_digest: <%= EmailToken.digest("pending-invitation-token") %>
  expires_at: <%= 1.day.from_now %>

expired:
  account: acme
  email: expired@example.test
  role: agent
  status: pending
  token_digest: <%= EmailToken.digest("expired-invitation-token") %>
  expires_at: <%= 1.day.ago %>

globex:
  account: globex
  email: globex-invitee@example.test
  role: agent
  status: pending
  token_digest: <%= EmailToken.digest("globex-invitation-token") %>
  expires_at: <%= 1.day.from_now %>
