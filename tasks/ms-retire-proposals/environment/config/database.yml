default: &default
  adapter: postgresql
  encoding: unicode
  host: /var/lib/postgresql/sockets
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  schema_search_path: "public,shared_extensions"
  username: consul

development:
  <<: *default
  database: consul_development

test:
  <<: *default
  database: consul_test
